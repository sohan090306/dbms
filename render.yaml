services:
  - type: web
    name: gym-management-system
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3000
      - key: DB_HOST
        placeholder: "Enter your cloud MySQL host address (e.g. host.clever-cloud.com)"
      - key: DB_USER
        placeholder: "Enter your cloud MySQL username"
      - key: DB_PASSWORD
        placeholder: "Enter your cloud MySQL password"
      - key: DB_NAME
        placeholder: "Enter your cloud MySQL database name"
