<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gym Management</title>
    <meta name="description" content="Admin dashboard for the Gym Membership Management System.">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>GymAdmin</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="active">Dashboard</a>
                <a href="members.html">Members</a>
                <a href="trainers.html">Trainers</a>
                <a href="attendance.html">Attendance</a>
                <a href="payments.html">Payments</a>
                <a href="reports.html">Reports</a>
                <a href="#" id="logoutBtn">Logout</a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="topbar">
                <h1>Overview Dashboard</h1>
                <div class="user-info">Admin User</div>
            </header>
            
            <div class="dashboard-cards">
                <div class="card">
                    <h3>Total Members</h3>
                    <p class="card-value" id="totalMembers">Loading...</p>
                </div>
                <div class="card">
                    <h3>Total Trainers</h3>
                    <p class="card-value" id="totalTrainers">Loading...</p>
                </div>
                <div class="card">
                    <h3>Total Revenue</h3>
                    <p class="card-value" id="totalRevenue">Loading...</p>
                </div>
            </div>
            
            <div class="recent-section">
                <h2>Quick Actions</h2>
                <div class="action-buttons">
                    <a href="members.html" class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                        Add New Member
                    </a>
                    <a href="attendance.html" class="btn btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        Record Attendance
                    </a>
                    <a href="payments.html" class="btn btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                        Log Payment
                    </a>
                </div>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
