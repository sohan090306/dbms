<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainers - Gym Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>GymAdmin</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="members.html">Members</a>
                <a href="trainers.html" class="active">Trainers</a>
                <a href="attendance.html">Attendance</a>
                <a href="payments.html">Payments</a>
                <a href="reports.html">Reports</a>
                <a href="#" id="logoutBtn">Logout</a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="topbar">
                <h1>Manage Trainers</h1>
            </header>
            
            <div class="content-section">
                <div class="action-bar">
                    <button class="btn btn-primary" onclick="toggleModal('addTrainerModal')">Add New Trainer</button>
                    <input type="text" placeholder="Search trainers..." onkeyup="filterTable('trainersTable', this.value)">
                </div>

                <div class="table-container">
                    <table id="trainersTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Specialization</th>
                                <th>Phone</th>
                                <th>Hire Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="trainersTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Trainer Modal -->
    <div id="addTrainerModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="toggleModal('addTrainerModal')">&times;</span>
            <h2>Add New Trainer</h2>
            <form id="addTrainerForm">
                <div class="input-group">
                    <label>Name</label>
                    <input type="text" id="t_name" required>
                </div>
                <div class="input-group">
                    <label>Specialization</label>
                    <input type="text" id="t_spec" required>
                </div>
                <div class="input-group">
                    <label>Phone</label>
                    <input type="text" id="t_phone">
                </div>
                <div class="input-group">
                    <label>Hire Date</label>
                    <input type="date" id="t_hire_date" required>
                </div>
                <button type="submit" class="btn btn-primary">Save Trainer</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadTrainers);
    </script>
</body>
</html>
