<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - Gym Management</title>
    <meta name="description" content="Track gym member attendance and check-in records.">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>GymAdmin</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="members.html">Members</a>
                <a href="trainers.html">Trainers</a>
                <a href="attendance.html" class="active">Attendance</a>
                <a href="payments.html">Payments</a>
                <a href="reports.html">Reports</a>
                <a href="#" id="logoutBtn">Logout</a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="topbar">
                <h1>Attendance Records</h1>
            </header>
            
            <div class="content-section">
                <div class="action-bar">
                    <button class="btn btn-primary" onclick="toggleModal('addAttendanceModal')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Record Attendance
                    </button>
                    <input type="text" placeholder="Search records..." onkeyup="filterTable('attendanceTable', this.value)">
                </div>

                <div class="table-container">
                    <table id="attendanceTable">
                        <thead>
                            <tr>
                                <th>Record ID</th>
                                <th>Member Name</th>
                                <th>Date</th>
                                <th>Check-in Time</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Attendance Modal -->
    <div id="addAttendanceModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="toggleModal('addAttendanceModal')">&times;</span>
            <h2>Record Attendance</h2>
            <form id="addAttendanceForm">
                <div class="input-group">
                    <label>Member ID</label>
                    <input type="number" id="a_member_id" placeholder="Enter member ID" required>
                </div>
                <div class="input-group">
                    <label>Date</label>
                    <input type="date" id="a_date" required>
                </div>
                <div class="input-group">
                    <label>Time</label>
                    <input type="time" id="a_time" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Save Record</button>
            </form>
        </div>
    </div>

    <!-- Update Attendance Modal -->
    <div id="updateAttendanceModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="toggleModal('updateAttendanceModal')">&times;</span>
            <h2>Update Attendance</h2>
            <form id="updateAttendanceForm">
                <input type="hidden" id="upd_a_id">
                <div class="input-group">
                    <label>Member ID</label>
                    <input type="number" id="upd_a_member_id" placeholder="Enter member ID" required>
                </div>
                <div class="input-group">
                    <label>Date</label>
                    <input type="date" id="upd_a_date" required>
                </div>
                <div class="input-group">
                    <label>Time</label>
                    <input type="time" id="upd_a_time" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Update Record</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadAttendance);
    </script>
</body>
</html>
