<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments - Gym Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>GymAdmin</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="members.html">Members</a>
                <a href="trainers.html">Trainers</a>
                <a href="attendance.html">Attendance</a>
                <a href="payments.html" class="active">Payments</a>
                <a href="reports.html">Reports</a>
                <a href="#" id="logoutBtn">Logout</a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="topbar">
                <h1>Payment Records</h1>
            </header>
            
            <div class="content-section">
                <div class="action-bar">
                    <button class="btn btn-primary" onclick="toggleModal('addPaymentModal')">Log Payment</button>
                    <input type="text" placeholder="Search payments..." onkeyup="filterTable('paymentsTable', this.value)">
                </div>

                <div class="table-container">
                    <table id="paymentsTable">
                        <thead>
                            <tr>
                                <th>Payment ID</th>
                                <th>Member Name</th>
                                <th>Amount ($)</th>
                                <th>Date</th>
                                <th>Method</th>
                            </tr>
                        </thead>
                        <tbody id="paymentsTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Payment Modal -->
    <div id="addPaymentModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="toggleModal('addPaymentModal')">&times;</span>
            <h2>Log New Payment</h2>
            <form id="addPaymentForm">
                <div class="input-group">
                    <label>Member ID</label>
                    <input type="number" id="p_member_id" required>
                </div>
                <div class="input-group">
                    <label>Amount ($)</label>
                    <input type="number" step="0.01" id="p_amount" required>
                </div>
                <div class="input-group">
                    <label>Date</label>
                    <input type="date" id="p_date" required>
                </div>
                <div class="input-group">
                    <label>Method</label>
                    <select id="p_method">
                        <option value="Cash">Cash</option>
                        <option value="Credit Card">Credit Card</option>
                        <option value="Debit Card">Debit Card</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Save Payment</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadPayments);
    </script>
</body>
</html>
