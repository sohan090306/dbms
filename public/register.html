<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Management System - Register</title>
    <meta name="description" content="Register a new admin account for the Gym Membership Management System.">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-bg">
    <div class="login-container">
        <div class="login-card">
            <div style="margin-bottom: 1.5rem;">
                <div style="width: 56px; height: 56px; margin: 0 auto 1rem; border-radius: 14px; background: linear-gradient(135deg, #6C63FF, #8B5CF6); display: flex; align-items: center; justify-content: center;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                </div>
                <h2>Create Admin</h2>
                <p>Register a new admin account to manage the gym.</p>
            </div>
            <form id="registerForm">
                <div class="input-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" placeholder="e.g. SOHAN_K_A" required>
                </div>
                <div class="input-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="Create a password" required>
                </div>
                <div class="input-group">
                    <label for="regConfirmPassword">Confirm Password</label>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Create Account</button>
                <div style="margin-top: 1.2rem; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
                    Already have an account? <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Login here</a>
                </div>
            </form>
            <div id="registerMsg" class="error-msg"></div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
