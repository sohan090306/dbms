<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Management System - Register</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-bg">
    <div class="login-container">
        <div class="login-card">
            <h2>Create Admin</h2>
            <p>Register a new admin account to manage the gym.</p>
            <form id="registerForm">
                <div class="input-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" placeholder="e.g. SOHAN_K_A" required>
                </div>
                <div class="input-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="Create a password" required>
                </div>
                <div class="input-group">
                    <label for="regConfirmPassword">Confirm Password</label>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
                <div style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
                    Already have an account? <a href="index.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Login here</a>
                </div>
            </form>
            <div id="registerMsg" class="error-msg"></div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
