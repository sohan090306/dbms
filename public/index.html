<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Management System - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-bg">
    <div class="login-container">
        <div class="login-card">
            <h2>Gym Admin</h2>
            <p>Welcome back! Please login to your account.</p>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="admin" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="admin" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
                <div style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
                    Don't have an account? <a href="register.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Register here</a>
                </div>
            </form>
            <div id="loginError" class="error-msg"></div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
