<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Membership Management System</title>
    <!-- Google Font for premium look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="public/css/style.css" />
    <style>
        body {font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #1e3c72, #2a5298, #0a192f); color: #fff; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;}
        .card {background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border-radius: 12px; padding: 2rem; text-align:center; max-width:400px; width:90%;}
        a {color:#ffdd57; text-decoration:none; font-weight:600;}
        a:hover {text-decoration:underline;}
    </style>
</head>
<body>
    <main class="login-bg" style="padding:4rem 1rem;">
        <div class="login-container" style="max-width:1100px; display:grid; grid-template-columns:1fr 420px; gap:2.5rem; align-items:center;">
            <section style="color:var(--text);">
                <h1 style="font-size:2.4rem; margin:0 0 0.6rem 0;">Welcome to GymAdmin</h1>
                <p style="color:var(--text-secondary); font-size:1.05rem; margin-bottom:1.4rem;">Manage members, attendance, payments and reports with a modern, responsive interface.</p>
                <div class="action-buttons" style="margin-bottom:1.2rem;">
                    <a class="btn btn-secondary" href="public/register.html">Create Account</a>
                </div>
            </section>

            <aside>
                <div class="login-card">
                    <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
                        <div style="width:72px; height:72px; border-radius:14px; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-md);">
                            <svg width="34" height="34" viewBox="0 0 24 24" fill="white"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/></svg>
                        </div>
                        <h2 style="margin:0;">GymAdmin</h2>
                        <p style="color:var(--text-secondary); margin:0;">Sign in to continue to the admin panel</p>
                    </div>
                    <div style="margin-top:1rem;">
                        <a class="btn btn-primary w-100" href="public/index.html">Sign In</a>
                    </div>
                </div>
            </aside>
        </div>
    </main>
    <script src="public/js/app.js"></script>
</body>
</html>
